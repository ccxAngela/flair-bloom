[package]
name = "flair-bloom"
version.workspace = true
edition.workspace = true

[lib]
name = "flair_bloom_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-store = "2"
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
# 崩溃提示窗口：panic hook 里没有 AppHandle，直接用 rfd 弹原生对话框
# （与 tauri-plugin-dialog 底层同源同版本，不额外增加依赖树）
rfd = "0.16"
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
crypto = { path = "../../../packages/crypto" }
qzh-format = { path = "../../../packages/qzh-format" }
qzh-profile = { path = "../../../packages/qzh-profile" }
resource-integrity = { path = "../../../packages/resource-integrity" }
win-sysinfo = { path = "../../../packages/win-sysinfo" }
win-input = { path = "../../../packages/win-input" }
burst-engine = { path = "../../../packages/burst-engine" }
win-driver = { path = "../../../packages/win-driver" }
# 兑换码激活的 HTTP：与 tauri-plugin-updater 同版本同 feature，不多编一份；
# rustls 加密提供者同 updater 一样在首次请求前懒装 ring
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell", "Win32_Storage_FileSystem"] }
webview2-com = "0.38"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
    "Win32_System_Registry",
    "Win32_Security",
] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSResponder", "NSWindow"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSGeometry"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
